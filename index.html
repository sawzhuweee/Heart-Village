<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>心之村｜情緒村地圖</title>
<meta name="description" content="心之村 Emotion Village — 八位陪伴情緒的夥伴，和一間永遠開著門的情緒小參室。" />

<!-- PWA -->
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#fbf6ec" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" />
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="心之村" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://res.cloudinary.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />

<style>
:root{
  --paper:#f3ece0; --ink:#3a2f22; --brown:#7a5a2e; --brown-d:#5f4522;
  --muted:#8a7457; --sub:#6b5940; --body:#5c4a33; --card:#fffdf8;
  --line:rgba(122,90,46,.2); --line-s:rgba(122,90,46,.3);
  --header-h:64px;
  --serif:"Noto Serif TC",serif; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
  overflow-x:hidden; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
img{max-width:100%}
a{color:var(--brown);text-decoration:none}
button,input,textarea{font-family:inherit}
button{min-height:44px}

@keyframes pulseRing{0%{transform:scale(.7);opacity:.9}70%{transform:scale(1.9);opacity:0}100%{transform:scale(1.9);opacity:0}}
@keyframes softIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes riseIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  html{scroll-behavior:auto}
}

/* ---------- shell ---------- */
.page{min-height:100vh;min-height:100svh;background:radial-gradient(circle at 50% 0%,#fbf6ec 0%,#efe5d4 60%,#e6d9c3 100%)}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(36px,6vw,64px) clamp(16px,4vw,40px)}
.wrap-narrow{max-width:1000px}
section[id]{scroll-margin-top:calc(var(--header-h) + 8px)}

/* ---------- header ---------- */
.site-header{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px clamp(16px,4vw,40px);padding-top:max(12px,env(safe-area-inset-top));
  border-bottom:1px solid var(--line);background:rgba(251,246,236,.94);backdrop-filter:blur(8px);
}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--serif);font-size:clamp(19px,4.4vw,24px);font-weight:700;letter-spacing:2px;color:#4a3a26}
.brand span{font-size:12px;letter-spacing:3px;color:var(--muted);white-space:nowrap}
.nav{display:flex;align-items:center;gap:clamp(14px,2.2vw,28px);font-size:15px}
.nav a{color:#5c4a33;padding:6px 2px;white-space:nowrap}
.nav a:hover{color:#c08a3e}
.pill{
  border:1px solid rgba(122,90,46,.4);background:transparent;color:var(--brown);
  font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:background .2s ease,color .2s ease;
}
.pill:hover{background:var(--brown);color:#fbf6ec}
.pill--go{background:var(--brown);color:#fdf7ea;border-color:var(--brown)}
.pill--go:hover{background:var(--brown-d);color:#fdf7ea}
#installBtn{display:none}
html[data-standalone] #installBtn{display:none !important} /* 已經是 App 就不再顯示安裝 */
.nav-toggle{display:none;border:1px solid var(--line-s);background:transparent;border-radius:10px;width:44px;height:44px;cursor:pointer;padding:0;color:var(--brown)}
.nav-toggle span,.nav-toggle span::before,.nav-toggle span::after{
  content:"";display:block;width:18px;height:2px;background:currentColor;border-radius:2px;margin:0 auto;position:relative;transition:transform .2s ease,opacity .2s ease;
}
.nav-toggle span::before{position:absolute;top:-6px}
.nav-toggle span::after{position:absolute;top:6px}
.nav-toggle[aria-expanded="true"] span{background:transparent}
.nav-toggle[aria-expanded="true"] span::before{transform:translateY(6px) rotate(45deg)}
.nav-toggle[aria-expanded="true"] span::after{transform:translateY(-6px) rotate(-45deg)}

@media (max-width:860px){
  .nav-toggle{display:block}
  .nav{
    position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;gap:0;
    background:#fbf6ec;border-bottom:1px solid var(--line);box-shadow:0 18px 32px rgba(70,50,25,.14);
    padding:6px clamp(16px,4vw,40px) 14px;display:none;
  }
  .nav.open{display:flex;animation:softIn .22s ease both}
  .nav a{padding:14px 4px;border-bottom:1px solid rgba(122,90,46,.12);font-size:16px}
  .nav .pill{margin-top:12px;text-align:center;padding:12px 14px;font-size:15px}
}

/* ---------- hero + map ---------- */
.hero{text-align:center;margin-bottom:clamp(22px,4vw,34px)}
.hero h1{font-family:var(--serif);font-size:clamp(28px,7vw,46px);font-weight:700;letter-spacing:clamp(2px,1.2vw,6px);margin:0 0 12px}
.hero p{font-size:clamp(15px,3.6vw,17px);line-height:2;color:var(--sub);margin:0;text-wrap:pretty}
.map-frame{
  position:relative;border-radius:clamp(12px,2vw,18px);overflow:hidden;
  box-shadow:0 24px 60px rgba(60,42,20,.28);border:clamp(4px,1.2vw,8px) solid #f7f1e5;
}
.map-frame img{display:block;width:100%;height:auto}
.hot{
  position:absolute;transform:translate(-50%,-50%);width:max(3.2%,30px);aspect-ratio:1;min-height:0;
  border:0;border-radius:50%;background:rgba(255,232,150,.9);box-shadow:0 0 14px 4px rgba(255,214,110,.75);
  cursor:pointer;padding:0;transition:transform .25s ease;
}
.hot::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,226,140,.9);animation:pulseRing 2.4s ease-out infinite;animation-delay:var(--d,0s)}
.hot::after{content:"";position:absolute;inset:-11px;border-radius:50%}
.hot:hover,.hot:focus-visible{transform:translate(-50%,-50%) scale(1.45);outline:none}
.hot--soft{background:rgba(232,240,255,.85);box-shadow:0 0 12px 3px rgba(200,220,255,.6);width:max(2.6%,26px)}
.hot--soft::before{border-color:rgba(226,238,255,.9)}
.hot--post{width:max(4.4%,36px);border:2px solid rgba(255,248,222,.95);background:rgba(255,255,255,.35);box-shadow:0 0 20px 6px rgba(255,246,205,.7)}
.hot--post::before{inset:-2px;border-color:rgba(255,255,255,.85);animation-duration:2.8s}
.map-note{text-align:center;font-size:14px;color:var(--muted);margin:16px 0 0;letter-spacing:1px}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{
  border:1px solid var(--line-s);background:var(--card);color:var(--body);font-size:14px;
  padding:9px 15px;border-radius:999px;cursor:pointer;line-height:1.2;
  box-shadow:0 4px 12px rgba(70,50,25,.07);transition:transform .18s ease,background .18s ease;
}
.chip:hover{background:#f7efdf;transform:translateY(-2px)}
.chip i{font-style:normal;color:var(--muted);font-size:12px;margin-left:6px}

/* ---------- headings ---------- */
.h2{font-family:var(--serif);font-size:clamp(24px,5.4vw,32px);letter-spacing:clamp(2px,.8vw,4px);text-align:center;margin:0 0 10px}
.lede{text-align:center;color:var(--sub);margin:0 0 clamp(24px,4vw,40px);font-size:15px;line-height:2}

/* ---------- character cards ---------- */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,2vw,22px)}
.card{
  border:0;padding:0;cursor:pointer;border-radius:16px;overflow:hidden;background:#fff;text-align:left;
  box-shadow:0 10px 26px rgba(70,50,25,.14);transition:transform .25s ease,box-shadow .25s ease;
  display:flex;flex-direction:column;
}
.card:hover,.card:focus-visible{transform:translateY(-6px);box-shadow:0 18px 38px rgba(70,50,25,.24);outline:none}
.card-art{height:clamp(126px,20vw,180px);display:grid;place-items:center}
.card-art img{max-height:84%;max-width:80%;object-fit:contain}
.card-body{padding:14px 16px 18px;background:var(--card);flex:1}
.card-name{font-family:var(--serif);font-size:clamp(17px,2.4vw,20px);font-weight:600;color:var(--ink)}
.card-meta{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:1px}
.card-lead{font-size:13.5px;color:var(--body);margin-top:9px;line-height:1.8}
@media (max-width:1080px){.cards{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:400px){.cards{grid-template-columns:1fr}.card{flex-direction:row;align-items:stretch}.card-art{width:40%;height:auto;min-height:120px;flex:none}}

/* ---------- post ---------- */
.post{background:#efe4d0;border-top:1px solid rgba(122,90,46,.18);border-bottom:1px solid rgba(122,90,46,.18)}
.post-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,3vw,34px);align-items:start}
@media (max-width:900px){.post-grid{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:16px;padding:clamp(18px,3vw,28px);box-shadow:0 12px 30px rgba(70,50,25,.14)}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;letter-spacing:1px}
.inp,.txt{
  width:100%;border:1px solid var(--line-s);border-radius:9px;padding:12px 13px;
  font-size:16px;background:#fff;color:var(--ink);line-height:1.7;
}
.inp:focus,.txt:focus{outline:2px solid rgba(122,90,46,.35);outline-offset:1px}
.txt{height:130px;resize:vertical;line-height:1.9}
.moods{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.mood{border:1px solid var(--line-s);background:transparent;color:var(--sub);font-size:14px;padding:9px 15px;border-radius:999px;cursor:pointer;min-height:40px}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--sub);margin:14px 0 18px;cursor:pointer;line-height:1.6}
.check input{width:18px;height:18px;accent-color:var(--brown);flex:none}
.btn-main{
  width:100%;border:0;background:var(--brown);color:#fdf7ea;font-size:16px;letter-spacing:3px;
  padding:15px;border-radius:10px;cursor:pointer;transition:background .2s ease;
}
.btn-main:hover{background:var(--brown-d)}
.wall-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.wall-head h3{font-family:var(--serif);font-size:20px;margin:0;letter-spacing:2px}
.wall-head span{font-size:13px;color:var(--muted)}
.wall{display:flex;flex-direction:column;gap:12px;max-height:460px;overflow-y:auto;padding-right:4px;-webkit-overflow-scrolling:touch}
@media (max-width:900px){.wall{max-height:none;overflow:visible;padding-right:0}}
.note{background:var(--card);border-radius:13px;padding:15px 17px;box-shadow:0 6px 16px rgba(70,50,25,.1);animation:softIn .4s ease both}
.note-top{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.note-nick{font-size:15px;font-weight:500}
.tag{font-size:12px;padding:3px 9px;border-radius:999px}
.note-date{font-size:12px;color:#a3906f;margin-left:auto}
.note-text{font-size:14px;line-height:1.95;color:var(--body);text-wrap:pretty;white-space:pre-wrap;overflow-wrap:anywhere}
.note-reply{font-size:13px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px dashed rgba(122,90,46,.25)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:26px 10px;line-height:2}

/* ---------- about ---------- */
.about{text-align:center}
.about p{font-size:clamp(15px,3.4vw,16px);line-height:2.2;color:var(--body);margin:0 auto;max-width:720px;text-wrap:pretty}
.stats{display:flex;justify-content:center;gap:clamp(12px,3vw,40px);margin-top:36px;flex-wrap:wrap}
.stat{background:var(--card);border-radius:14px;padding:20px clamp(20px,4vw,34px);box-shadow:0 8px 22px rgba(70,50,25,.12);min-width:104px}
.stat b{display:block;font-family:var(--serif);font-size:clamp(24px,5vw,30px);color:var(--brown);font-weight:600}
.stat span{font-size:12.5px;color:var(--muted);letter-spacing:2px;margin-top:4px;display:block}
.foot{border-top:1px solid var(--line);padding:24px clamp(16px,4vw,40px);padding-bottom:max(24px,env(safe-area-inset-bottom));text-align:center;font-size:13px;color:var(--muted);line-height:2}

/* ---------- overlays ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;background:rgba(40,30,18,.62);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:clamp(10px,3vw,40px);overscroll-behavior:contain;
}
.overlay[hidden]{display:none}
.sheet{
  width:min(940px,100%);max-height:min(88vh,88svh);overflow-y:auto;border-radius:20px;position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,.4);animation:riseIn .32s ease both;-webkit-overflow-scrolling:touch;
}
.x-btn{
  position:absolute;right:14px;top:12px;border:0;background:rgba(0,0,0,.14);color:inherit;
  width:40px;height:40px;min-height:40px;border-radius:50%;font-size:20px;cursor:pointer;z-index:2;line-height:1;
}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;padding:clamp(26px,4vw,46px) clamp(20px,4vw,48px)}
.modal-place{font-size:12.5px;letter-spacing:4px;opacity:.72;margin-bottom:10px}
.modal-h{font-family:var(--serif);font-size:clamp(26px,5.6vw,38px);font-weight:600;margin:0 0 20px;letter-spacing:3px;line-height:1.35}
.blk{margin-bottom:18px}
.blk-l{font-size:17px;font-weight:500;margin-bottom:6px;letter-spacing:2px}
.blk-line{font-size:15px;line-height:1.95;opacity:.9}
.modal-art{display:grid;place-items:center}
.modal-art img{max-width:100%;max-height:min(380px,42vh);object-fit:contain}
@media (max-width:820px){
  .modal-grid{grid-template-columns:1fr;gap:6px;padding-top:52px}
  .modal-art{order:-1}
  .modal-art img{max-height:30vh}
}

/* ---------- admin ---------- */
.admin-sheet{background:#fdfaf3;padding:clamp(20px,3vw,34px) clamp(16px,3vw,36px) clamp(26px,4vw,40px);width:min(1000px,100%)}
.admin-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.admin-top h3{font-family:var(--serif);font-size:clamp(20px,4.4vw,26px);margin:0;letter-spacing:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:#f3ebdb;border-radius:12px;padding:16px 18px}
.kpi span{font-size:12px;color:var(--muted);letter-spacing:2px}
.kpi b{display:block;font-family:var(--serif);font-size:26px;color:var(--brown-d);margin-top:4px;font-weight:600}
.tabs{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.tab{border:0;background:#efe4d0;color:var(--sub);font-size:14px;padding:10px 20px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--brown);color:#fdf7ea}
.row{background:#fff;border:1px solid rgba(122,90,46,.16);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.row-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.row-acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini{border:1px solid var(--line-s);background:transparent;color:var(--brown);font-size:13px;padding:8px 15px;border-radius:999px;cursor:pointer;min-height:38px}
.mini--danger{border-color:rgba(160,60,50,.35);color:#a04236}
.edit-txt{width:100%;border:1px solid rgba(122,90,46,.25);border-radius:9px;padding:11px 13px;font-size:15px;line-height:1.85;height:150px;resize:vertical}
.swatch{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-block;flex:none}
.lock{padding:24px 0 8px}
.lock-row{display:flex;gap:10px;flex-wrap:wrap}
.lock-row .inp{flex:1;min-width:180px}

/* ---------- toast / offline ---------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));
  z-index:90;background:#3a2f22;color:#fbf6ec;font-size:14px;padding:12px 18px;border-radius:999px;
  box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);
  animation:riseIn .3s ease both;
}
.toast[hidden]{display:none}
.toast button{border:0;background:#fbf6ec;color:#3a2f22;font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer;min-height:34px;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>

<body>
<div class="page">

  <header class="site-header">
    <div class="brand"><b>心之村</b><span>EMOTION VILLAGE</span></div>
    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="nav" aria-label="開啟選單"><span></span></button>
    <nav class="nav" id="nav">
      <a href="#map">村莊地圖</a>
      <a href="#friends">八位夥伴</a>
      <a href="#post">飛鴿驛站</a>
      <a href="#about">關於小參室</a>
      <button class="pill pill--go" id="installBtn" type="button">📲 安裝到手機</button>
      <button class="pill" data-act="openAdmin" type="button">管理後台</button>
    </nav>
  </header>

  <section id="map" class="wrap" style="padding-bottom:8px">
    <div class="hero">
      <h1>歡迎來到心之村</h1>
      <p>這裡住著八位陪伴情緒的夥伴。<br />點一個地方，就會有人走出來，跟你說說話。</p>
    </div>
    <div class="map-frame" id="mapFrame">
      <img id="mapImg" alt="心之村地圖" width="1600" height="1000" fetchpriority="high" />
    </div>
    <p class="map-note">✦ 點亮的光點，是可以走進去的地方 ✦</p>
    <div class="legend" id="legend"></div>
  </section>

  <section id="friends" class="wrap">
    <h2 class="h2">八位夥伴</h2>
    <p class="lede">每一種情緒，都有人在等你。</p>
    <div class="cards" id="cards"></div>
  </section>

  <section id="post" class="post">
    <div class="wrap wrap-narrow">
      <h2 class="h2">飛鴿驛站</h2>
      <p class="lede">把煩惱寫下來，交給鴿子。<br />牠會替你送到村子裡，最適合陪你的那位夥伴手上。</p>
      <div class="post-grid">
        <div class="panel">
          <label class="lbl" for="nick">你想怎麼被稱呼</label>
          <input class="inp" id="nick" placeholder="旅人" autocomplete="nickname" style="margin-bottom:18px" />
          <span class="lbl">今天的心情</span>
          <div class="moods" id="moods"></div>
          <label class="lbl" for="text">想說的話</label>
          <textarea class="txt" id="text" placeholder="這裡不需要說得漂亮，想到什麼就寫什麼。"></textarea>
          <label class="check"><input type="checkbox" id="priv" />只給村長看，不要公開在留言牆</label>
          <button class="btn-main" id="sendBtn" data-act="send" type="button">交給鴿子</button>
        </div>
        <div>
          <div class="wall-head"><h3>留言牆</h3><span id="wallCount">共 0 則</span></div>
          <div class="wall" id="wall"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="about" class="wrap wrap-narrow about">
    <h2 class="h2">關於情緒小參室</h2>
    <p id="aboutText"></p>
    <div class="stats">
      <div class="stat"><b id="statViews">0</b><span>瀏覽人次</span></div>
      <div class="stat"><b id="statMsgs">0</b><span>收到的信</span></div>
      <div class="stat"><b>8</b><span>位陪伴夥伴</span></div>
    </div>
  </section>

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function persist(patch){
  var d = load(); for (var k in patch) d[k] = patch[k];
  try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){}
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function $(id){ return document.getElementById(id); }

/* 後台文字 -> 角色資料 */
function chars(){
  return BASE.map(function(c){
    var o = S.overrides[c.key];
    if (!o) return c;
    var out = {}; for (var k in c) out[k] = c[k];
    var secs = {'負責陪伴':'companion','個性':'personality','工作':'work'};
    var buf = {companion:[], personality:[], work:[]}, cur = null;
    String(o).split('\n').map(function(s){ return s.trim(); }).forEach(function(l){
      if (!l) return;
      if (secs[l]) { cur = secs[l]; return; }
      if (cur) buf[cur].push(l);
      else if (l.indexOf('｜') > -1) { var p = l.split('｜'); out.name = p[0].trim(); out.title = (p[1]||'').trim(); }
    });
    ['companion','personality','work'].forEach(function(k){ if (buf[k].length) out[k] = buf[k]; });
    return out;
  });
}
function charByKey(k){ var a = chars(); for (var i=0;i<a.length;i++) if (a[i].key===k) return a[i]; return null; }
function toText(c){
  return c.name + '｜' + c.title + '\n負責陪伴\n' + c.companion.join('\n') +
         '\n個性\n' + c.personality.join('\n') + '\n工作\n' + c.work.join('\n');
}
function moodMeta(l){ for (var i=0;i<MOODS.length;i++) if (MOODS[i].label===l) return MOODS[i]; return MOODS[5]; }

/* ============================ 畫面 ============================ */
function renderMap(){
  var img = $('mapImg');
  img.src = cld(V.main, 'f_auto,q_auto,w_1600');
  img.srcset = [800,1200,1600,2000].map(function(w){ return cld(V.main,'f_auto,q_auto,w_'+w) + ' ' + w + 'w'; }).join(', ');
  img.sizes = '(max-width:1240px) 100vw, 1240px';

  var frame = $('mapFrame'), html = '';
  SPOTS.forEach(function(s, i){
    var label = s.label;
    if (!label) { var c = charByKey(s.key); label = c ? (c.place + ' · ' + c.name) : (PLACES[s.key] ? PLACES[s.key].heading : s.key); }
    html += '<button class="hot ' + s.cls + '" style="left:' + s.l + '%;top:' + s.t + '%;--d:' + (i * 0.3) + 's" ' +
            'data-act="' + (s.key === '__post' ? 'goPost' : 'open') + '" data-key="' + esc(s.key) + '" ' +
            'title="' + esc(label) + '" aria-label="' + esc(label) + '" type="button"></button>';
  });
  frame.insertAdjacentHTML('beforeend', html);
}

function renderLegend(){
  var html = '';

    html += '<button class="chip" data-act="open" data-key="' + esc(c.key) + '" type="button">' +
            esc(c.name) + '<i>' + esc(c.place) + '</i></button>';
  });

    html += '<button class="chip" data-act="open" data-key="' + esc(k) + '" type="button">' + esc(PLACES[k].heading) + '</button>';

        'sizes="(max-width:820px) 45vw, 280px" alt="' + esc(c.name) + '" loading="lazy" decoding="async" />' +

/* ---------- 角色／地點視窗 ---------- */
function openModal(key){
  var m = null, c = charByKey(key);
  if (c) {
    m = {bg:c.bg, fg:c.fg, imgKey:c.key, place:c.place, heading:c.name + '｜' + c.title,
         blocks:[{label:'負責陪伴',lines:c.companion},{label:'個性',lines:c.personality},{label:'工作',lines:c.work}]};
  } else if (PLACES[key]) {
    var p = PLACES[key];
    m = {bg:p.bg, fg:p.fg, imgKey:p.img, place:p.place, heading:p.heading, blocks:p.blocks};
  }
  if (!m) return;
  S.modalKey = key; S.lastFocus = document.activeElement;
  $('modalSheet').setAttribute('style', 'background:' + m.bg + ';color:' + m.fg);
  $('modalSheet').innerHTML =
    '<button class="x-btn" data-act="closeModal" aria-label="關閉" type="button">×</button>' +
    '<div class="modal-grid">' +
      '<div>' +
        '<div class="modal-place">' + esc(m.place) + '</div>' +
        '<h3 class="modal-h" id="modalTitle">' + esc(m.heading) + '</h3>' +
        m.blocks.map(function(b){
          return '<div class="blk"><div class="blk-l">' + esc(b.label) + '</div>' +
            b.lines.map(function(l){ return '<div class="blk-line">' + esc(l) + '</div>'; }).join('') + '</div>';
        }).join('') +
      '</div>' +
      '<div class="modal-art"><img src="' + charImg(m.imgKey, 600) + '" alt="' + esc(m.heading) + '" /></div>' +
    '</div>';
  showOverlay($('modal'));
  pushLayer('modal', closeModalNow);
}
function closeModal(){ if (!$('modal').hidden) popLayer(); }

/* ---------- Android 返回鍵：先關彈窗，不要直接退出 App ---------- */
var layers = [];
function pushLayer(type, closeFn){
  layers.push({type:type, close:closeFn});
  try { history.pushState({village:type, depth:layers.length}, ''); } catch (e) {}
}
function popLayer(){
  if (!layers.length) return;
  if (history.state && history.state.village) history.back();   // 交給 popstate 收尾
  else layers.pop().close();                                    // 沒有歷史紀錄時直接關
}
window.addEventListener('popstate', function(e){
  var depth = (e.state && e.state.village) ? (e.state.depth || 0) : 0;
  while (layers.length > depth) { layers.pop().close(); }
});

/* ---------- overlay 共用 ---------- */
function showOverlay(el){
  el.hidden = false;
  document.body.style.overflow = 'hidden';
  var f = el.querySelector('button,input,textarea');
  if (f) f.focus({preventScroll:true});
}
function hideOverlay(el){
  el.hidden = true;
  if ($('modal').hidden && $('admin').hidden) document.body.style.overflow = '';
  if (S.lastFocus && S.lastFocus.focus) S.lastFocus.focus({preventScroll:true});
}

/* ---------- 提示 ---------- */
var toastTimer = null;
function toast(msg, actionLabel, action){
  clearTimeout(toastTimer);
  $('toastText').textContent = msg;
  var b = $('toastBtn');
  if (actionLabel) { b.hidden = false; b.textContent = actionLabel; b.onclick = action; }
  else { b.hidden = true; b.onclick = null; }
  $('toast').hidden = false;
  if (!actionLabel) toastTimer = setTimeout(function(){ $('toast').hidden = true; }, 3000);
}

/* ============================ 動作 ============================ */
function send(){
  var t = $('text').value.trim();
  if (!t) { $('text').focus(); toast('先寫一點想說的話吧。'); return; }
  var now = new Date();
  var msg = {
    id: Date.now(), nick: ($('nick').value.trim() || '匿名旅人'), mood: S.mood, text: t,
    date: now.getFullYear() + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + String(now.getDate()).padStart(2,'0'),
    pub: !$('priv').checked, priv: $('priv').checked
  };
  S.msgs = [msg].concat(S.msgs);
  persist({msgs:S.msgs});
  $('text').value = '';
  renderWall(); renderStats();
  var btn = $('sendBtn'); btn.textContent = '🕊 鴿子已經飛走了';
  setTimeout(function(){ btn.textContent = '交給鴿子'; }, 2600);
  toast(REPLIES[S.mood] || '鴿子已經把信送到了。');
}

function goPost(){
  var el = $('post');
  window.scrollTo({top: el.offsetTop - 70, behavior:'smooth'});
  setTimeout(function(){ $('text').focus({preventScroll:true}); }, 500);
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');

  if (act === 'open')       { openModal(el.getAttribute('data-key')); }
  else if (act === 'goPost'){ closeModal(); goPost(); }
  else if (act === 'closeModal'){ closeModal(); }
  else if (act === 'openAdmin'){ closeNav(); openAdmin(); }
  else if (act === 'closeAdmin'){ closeAdmin(); }
  else if (act === 'send')  { send(); }
  else if (act === 'mood')  { S.mood = el.getAttribute('data-mood'); renderMoods(); }
  else if (act === 'unlock'){
    var v = $('pw').value;
    if (v === PASSWORD) { S.unlocked = true; renderAdmin(); }
    else { $('pwErr').hidden = false; $('pw').value = ''; $('pw').focus(); }
  }
  else if (act === 'tab')   { S.tab = el.getAttribute('data-tab'); renderAdmin(); }
  else if (act === 'toggleMsg'){
    var id = el.getAttribute('data-id');
    S.msgs = S.msgs.map(function(m){ return String(m.id) === id ? Object.assign({}, m, {pub:!m.pub}) : m; });
    persist({msgs:S.msgs}); renderAdmin(); renderWall();
  }
  else if (act === 'delMsg'){
    if (!confirm('確定要刪除這則留言嗎？')) return;
    var did = el.getAttribute('data-id');
    S.msgs = S.msgs.filter(function(m){ return String(m.id) !== did; });
    persist({msgs:S.msgs}); renderAdmin(); renderWall(); renderStats();
  }
  else if (act === 'save'){
    S.about = S.draft.about; S.overrides = Object.assign({}, S.draft.chars);
    persist({about:S.about, overrides:S.overrides});
    renderCards(); renderLegend(); renderStats();
    toast('已儲存 ✓');
  }
  else if (act === 'reset'){
    if (!confirm('要把所有文字還原成預設嗎？')) return;
    S.about = DEFAULT_ABOUT; S.overrides = {}; S.draft = null;
    persist({about:DEFAULT_ABOUT, overrides:{}});
    renderCards(); renderLegend(); renderStats(); renderAdmin();
    toast('已還原成預設');
  }
});

/* 後台文字編輯 */
document.addEventListener('input', function(e){
  var t = e.target, which = t.getAttribute && t.getAttribute('data-edit');
  if (!which || !S.draft) return;
  if (which === 'about') S.draft.about = t.value;
  else S.draft.chars[t.getAttribute('data-key')] = t.value;
});

/* 表單狀態 */
document.addEventListener('change', function(e){
  if (e.target.id === 'nick') { S.nick = e.target.value; }
  if (e.target.id === 'priv') { S.priv = e.target.checked; }
});

/* 點背景關閉、Esc 關閉 */
['modal','admin'].forEach(function(id){
  $(id).addEventListener('click', function(e){ if (e.target === this) { id === 'modal' ? closeModal() : closeAdmin(); } });
});
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (!$('modal').hidden) closeModal();
  else if (!$('admin').hidden) closeAdmin();
  else closeNav();
});

/* 手機選單 */
function closeNav(){ $('nav').classList.remove('open'); $('navToggle').setAttribute('aria-expanded','false'); }
$('navToggle').addEventListener('click', function(){
  var open = $('nav').classList.toggle('open');
  this.setAttribute('aria-expanded', String(open));
});
$('nav').addEventListener('click', function(e){ if (e.target.tagName === 'A') closeNav(); });
/* 選單開著時點別的地方就收起來 */
document.addEventListener('click', function(e){
  if (!$('nav').classList.contains('open')) return;
  if (!e.target.closest('.site-header')) closeNav();
});

/* ============================ 啟動 ============================ */
(function init(){
  var d = load();
  var today = new Date().toISOString().slice(0,10);
  var daily = Object.assign({}, d.daily || {});
  daily[today] = (daily[today] || 0) + 1;
  S.views = (d.views || 1280) + 1;
  S.todayViews = daily[today];
  S.msgs = d.msgs || [
    {id:1, nick:'小魚', mood:'焦慮', text:'最近晚上都睡不著，一直在想白天講錯的話。', date:'2026/07/28', pub:true, priv:false},
    {id:2, nick:'匿名旅人', mood:'迷惘', text:'要不要換工作，想了三個月還是決定不了。', date:'2026/07/30', pub:true, priv:false}
  ];
  S.overrides = d.overrides || {};
  S.about = d.about || DEFAULT_ABOUT;
  persist({views:S.views, daily:daily, msgs:S.msgs});

  renderMap(); renderLegend(); renderCards(); renderMoods(); renderWall(); renderStats();
})();

/* ============================ PWA ============================ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){
        var sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', function(){
          if (sw.state === 'installed' && navigator.serviceWorker.controller) {
            toast('村子有新版本了', '重新載入', function(){ sw.postMessage('skipWaiting'); });
          }
        });
      });
    }).catch(function(){});
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (refreshing) return; refreshing = true; location.reload();
    });
  });
}

/* ---------- 安裝到主畫面 ---------- */
var deferredPrompt = null;
var standalone = window.matchMedia('(display-mode: standalone)').matches ||
                 window.matchMedia('(display-mode: minimal-ui)').matches ||
                 window.navigator.standalone === true ||
                 document.referrer.indexOf('android-app://') === 0;
if (standalone) document.documentElement.setAttribute('data-standalone', '');

function showInstall(){ if (!standalone) $('installBtn').style.display = 'inline-block'; }
function hideInstall(){ $('installBtn').style.display = 'none'; }

/* Android Chrome / Edge：攔下原生提示，改由「安裝到手機」按鈕觸發 */
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); deferredPrompt = e; showInstall();
});

/* 沒有原生提示的瀏覽器（iOS Safari、Samsung Internet、Firefox）：顯示手動步驟 */
setTimeout(function(){ if (!deferredPrompt) showInstall(); }, 2500);

function installHelp(){
  var ua = navigator.userAgent;
  var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  var isAndroid = /Android/.test(ua);
  var steps;
  if (isIOS)
    steps = ['在 Safari 最下方，點「分享」按鈕（方框加上箭頭）', '往下滑，選「加入主畫面」', '按右上角「新增」'];
  else if (isAndroid && /SamsungBrowser/.test(ua))
    steps = ['點瀏覽器右下角的「☰」選單', '選「新增頁面至」→「主畫面」', '按「新增」'];
  else if (isAndroid && /Firefox|FxiOS/.test(ua))
    steps = ['點右上角的「⋮」選單', '選「安裝」或「加到主畫面」'];
  else if (isAndroid)
    steps = ['點右上角的「⋮」選單', '選「安裝應用程式」或「加到主畫面」', '按「安裝」'];
  else
    steps = ['點網址列右側的安裝圖示（⊕ 或小螢幕圖示）', '或從瀏覽器選單選「安裝 心之村」'];

  openInfo('把心之村放進主畫面',
    '<p style="font-size:15px;line-height:2;color:var(--sub);margin:0 0 18px">' +
      '裝好之後會像一般 App 一樣有自己的圖示，開啟時沒有網址列，' + (isIOS ? '' : '沒網路也能逛村子。') + '</p>' +
    '<ol style="margin:0;padding-left:20px;font-size:15.5px;line-height:2.1;color:var(--body)">' +
      steps.map(function(s){ return '<li style="margin-bottom:6px">' + s + '</li>'; }).join('') +
    '</ol>');
}

$('installBtn').addEventListener('click', function(){
  closeNav();
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(r){
      deferredPrompt = null;
      if (r && r.outcome === 'accepted') hideInstall();
    });
  } else {
    installHelp();
  }
});

window.addEventListener('appinstalled', function(){
  deferredPrompt = null; hideInstall();
  toast('心之村已經住進你的手機了 🏡');
});

window.addEventListener('offline', function(){ toast('目前離線中，村子仍然可以逛。'); });
</script>
